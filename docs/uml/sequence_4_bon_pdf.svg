<svg viewBox="0 0 1180 548" width="100%" height="548" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#111827"/></marker></defs><rect width="1180" height="548" fill="#ffffff"/><text x="590" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Envoi d’un bon puis export PDF</text><rect x="5" y="58" width="130" height="34" fill="#eef2ff" stroke="#111827" stroke-width="1.4"/><text x="70" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Fournisseur</text><line x1="70" y1="92" x2="70" y2="513" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="265" y="58" width="130" height="34" fill="#eef2ff" stroke="#111827" stroke-width="1.4"/><text x="330" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Interface web</text><line x1="330" y1="92" x2="330" y2="513" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="525" y="58" width="130" height="34" fill="#eef2ff" stroke="#111827" stroke-width="1.4"/><text x="590" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">API Documents</text><line x1="590" y1="92" x2="590" y2="513" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="785" y="58" width="130" height="34" fill="#eef2ff" stroke="#111827" stroke-width="1.4"/><text x="850" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Base de données</text><line x1="850" y1="92" x2="850" y2="513" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="1045" y="58" width="130" height="34" fill="#eef2ff" stroke="#111827" stroke-width="1.4"/><text x="1110" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Dompdf</text><line x1="1110" y1="92" x2="1110" y2="513" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 5"/><line x1="70" y1="125" x2="330" y2="125" stroke="#111827" stroke-width="1.4" marker-end="url(#arrow)"/><text x="200" y="118" text-anchor="middle" font-size="11" font-weight="normal" fill="#111827">1. saisir montant, catégorie, note</text><line x1="330" y1="167" x2="590" y2="167" stroke="#111827" stroke-width="1.4" marker-end="url(#arrow)"/><text x="460" y="160" text-anchor="middle" font-size="11" font-weight="normal" fill="#111827">2. POST /rooms/{id}/documents</text><line x1="590" y1="209" x2="850" y2="209" stroke="#111827" stroke-width="1.4" marker-end="url(#arrow)"/><text x="720" y="202" text-anchor="middle" font-size="11" font-weight="normal" fill="#111827">3. vérifier lien ouvrier-fournisseur</text><line x1="590" y1="251" x2="850" y2="251" stroke="#111827" stroke-width="1.4" marker-end="url(#arrow)"/><text x="720" y="244" text-anchor="middle" font-size="11" font-weight="normal" fill="#111827">4. insérer document + lignes + pièces</text><line x1="590" y1="293" x2="330" y2="293" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 5"/><text x="460" y="286" text-anchor="middle" font-size="11" font-weight="normal" fill="#111827">5. document créé</text><line x1="70" y1="335" x2="330" y2="335" stroke="#111827" stroke-width="1.4" marker-end="url(#arrow)"/><text x="200" y="328" text-anchor="middle" font-size="11" font-weight="normal" fill="#111827">6. demander export PDF</text><line x1="330" y1="377" x2="590" y2="377" stroke="#111827" stroke-width="1.4" marker-end="url(#arrow)"/><text x="460" y="370" text-anchor="middle" font-size="11" font-weight="normal" fill="#111827">7. POST /documents/{id}/export-pdf</text><line x1="590" y1="419" x2="1110" y2="419" stroke="#111827" stroke-width="1.4" marker-end="url(#arrow)"/><text x="850" y="412" text-anchor="middle" font-size="11" font-weight="normal" fill="#111827">8. générer PDF</text><line x1="590" y1="461" x2="330" y2="461" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 5"/><text x="460" y="454" text-anchor="middle" font-size="11" font-weight="normal" fill="#111827">9. URL PDF</text></svg>