substitutions:
  _SERVICE_NAME: boon-api
  _REGION: europe-west1
  _REPOSITORY: boon-backend
  _DATABASE_URL: libsql://replace-me.turso.io
  _DATABASE_AUTH_TOKEN: REPLACE_ME
  _JWT_SECRET: REPLACE_ME
  _PUBLIC_API_BASE_URL: https://replace-me.run.app
  _CORS_ORIGIN: https://appboon.vercel.app

steps:
  - name: gcr.io/cloud-builders/docker
    id: Build Image
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID
      - backend

  - name: gcr.io/cloud-builders/docker
    id: Push Image
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy Cloud Run
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --set-env-vars
      - NODE_ENV=production,DATABASE_URL=${_DATABASE_URL},DATABASE_AUTH_TOKEN=${_DATABASE_AUTH_TOKEN},JWT_SECRET=${_JWT_SECRET},PUBLIC_API_BASE_URL=${_PUBLIC_API_BASE_URL},CORS_ORIGIN=${_CORS_ORIGIN},ALLOW_DEV_VERIFICATION_CODE=false

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID
