# Cloud Build scaffold for the dedicated Cloud Run PDF renderer.
# This file is not for the main API anymore.

steps:
  - name: gcr.io/cloud-builders/docker
    id: Build PDF Image
    args:
      - build
      - -f
      - pdf-service/Dockerfile
      - -t
      - REPLACE_WITH_IMAGE_URL
      - pdf-service

  - name: gcr.io/cloud-builders/docker
    id: Push PDF Image
    args:
      - push
      - REPLACE_WITH_IMAGE_URL

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy PDF Cloud Run
    entrypoint: gcloud
    args:
      - run
      - deploy
      - boon-pdf
      - --image
      - REPLACE_WITH_IMAGE_URL
      - --region
      - europe-west1
      - --platform
      - managed
      - --allow-unauthenticated
      - --set-env-vars
      - NODE_ENV=production,PDF_SERVICE_TOKEN=REPLACE_ME
